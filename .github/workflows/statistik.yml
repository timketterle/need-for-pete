name: Spieler-Statistik
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: statistik
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: mkdir out && python .github/scripts/stats_export.py out
      - name: Auf Branch statistik legen (immer nur ein Commit)
        run: |
          cd out
          git init -q -b statistik
          git config user.name "nfp-statistik"
          git config user.email "actions@users.noreply.github.com"
          git add spieler.json spieler.md
          git commit -q -m "Spieler-Statistik $(TZ=Europe/Berlin date '+%d.%m. %H:%M')"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" statistik
